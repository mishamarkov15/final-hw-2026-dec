openapi: 3.0.3
info:
  title: CashCraft API
  version: 1.0.0
  description: |
    Учёт личных расходов и бюджетов. Gateway обращается к Auth и Ledger по gRPC.
    Данные изолированы по пользователю JWT. Денежные значения имеют не более двух
    знаков после запятой. Бюджет фиксирован на категорию и проверяется по всем
    транзакциям; отчёт считает расходы за указанный период, включая обе границы.
    Для Google Apps Script нужен публичный HTTPS-адрес Gateway.
servers:
  - url: /
    description: Текущий адрес Gateway
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Budgets
  - name: Transactions
  - name: Reports
paths:
  /ping:
    get:
      tags: [Health]
      summary: Проверка HTTP-сервера
      operationId: ping
      security: []
      responses:
        '200':
          description: Gateway запущен
          content:
            text/plain:
              schema:
                type: string
                enum: [pong]
              example: pong
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация и получение JWT
      operationId: register
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/AuthSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Вход и получение JWT
      operationId: login
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/budgets:
    get:
      tags: [Budgets]
      summary: Список бюджетов текущего пользователя
      description: Результат кэшируется в Redis с TTL и отдельным ключом для каждого пользователя.
      operationId: listBudgets
      responses:
        '200':
          description: Массив бюджетов; при отсутствии данных возвращается []
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [Budgets]
      summary: Создать или обновить бюджет категории
      operationId: setBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
      responses:
        '201':
          description: Бюджет сохранён; существующий лимит категории обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/transactions:
    get:
      tags: [Transactions]
      summary: Список транзакций текущего пользователя
      operationId: listTransactions
      responses:
        '200':
          description: Массив транзакций; при отсутствии данных возвращается []
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [Transactions]
      summary: Добавить транзакцию с проверкой бюджета
      operationId: addTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Транзакция сохранена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/BudgetExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/transactions/import:
    post:
      tags: [Transactions]
      summary: Импорт CSV с отчётом по строкам
      description: |
        До 1000 записей. Обязательный заголовок amount,category,description,date.
        Разделитель — запятая, десятичный разделитель — точка, кодировка — UTF-8.
        Некорректный синтаксис CSV отклоняет запрос целиком. При ошибках в отдельных
        полях или превышении бюджета остальные корректные строки сохраняются.
        Строки обрабатываются конкурентно; порядок сохранения не гарантируется.
      operationId: importTransactions
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
            example: |
              amount,category,description,date
              450.00,еда,Обед,2026-11-05
              150.00,транспорт,Поездка,2026-11-05
      responses:
        '200':
          $ref: '#/components/responses/ImportSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/transactions/bulk:
    post:
      tags: [Transactions]
      summary: Конкурентное добавление нескольких транзакций
      description: |
        До 1000 записей. Валидные записи сохраняются, ошибки возвращаются по каждой
        отклонённой записи. Номер row начинается с 1. Порядок сохранения не гарантируется;
        при отмене запроса уже сохранённые записи остаются в базе.
      operationId: bulkTransactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactions]
              properties:
                transactions:
                  type: array
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/TransactionInput'
      responses:
        '200':
          $ref: '#/components/responses/ImportSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/transactions/export.csv:
    get:
      tags: [Transactions]
      summary: Экспорт всех транзакций текущего пользователя в CSV
      operationId: exportTransactions
      responses:
        '200':
          description: UTF-8 CSV с заголовком amount,category,description,date
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="transactions.csv"
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/reports/summary:
    get:
      tags: [Reports]
      summary: Расходы по категориям и использование бюджета за период
      description: |
        Обе даты включаются в период. Категории с бюджетом присутствуют даже без
        расходов. Категории без бюджета имеют has_budget=false, budget_limit=0 и
        budget_used_percent=0. Процент считается по расходам за выбранный период.
        Результат кэшируется в Redis на 30 секунд, ключ включает пользователя и даты.
      operationId: getReportSummary
      parameters:
        - in: query
          name: from
          required: true
          description: Первый день периода
          schema:
            type: string
            format: date
          example: '2026-11-01'
        - in: query
          name: to
          required: true
          description: Последний день периода, не раньше from
          schema:
            type: string
            format: date
          example: '2026-11-30'
      responses:
        '200':
          description: Отчёт текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: student@example.org
        password:
          type: string
          format: password
          writeOnly: true
          description: От 8 до 72 байт UTF-8
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp в секундах; после истечения нужен повторный вход
        user:
          type: object
          required: [id, email]
          properties:
            id:
              type: integer
              format: int64
            email:
              type: string
              format: email
    Money:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
      maximum: 999999999999.99
      multipleOf: 0.01
      example: 450
    Category:
      type: string
      minLength: 1
      maxLength: 100
      description: Непустая категория; строка из пробелов недопустима
      example: еда
    TransactionInput:
      type: object
      required: [amount, category, date]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        category:
          $ref: '#/components/schemas/Category'
        description:
          type: string
          maxLength: 2000
          example: Обед
        date:
          type: string
          format: date
          example: '2026-11-05'
    Transaction:
      allOf:
        - $ref: '#/components/schemas/TransactionInput'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              example: 1
    Budget:
      type: object
      required: [category, limit]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        limit:
          $ref: '#/components/schemas/Money'
      example:
        category: еда
        limit: 5000
    ReportSummary:
      type: object
      required: [from, to, total, categories]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        total:
          type: number
          format: double
          example: 450
        categories:
          type: array
          items:
            type: object
            required: [category, total, has_budget, budget_limit, budget_used_percent]
            properties:
              category:
                type: string
                example: еда
              total:
                type: number
                format: double
                example: 450
              has_budget:
                type: boolean
                example: true
              budget_limit:
                type: number
                format: double
                example: 5000
              budget_used_percent:
                type: number
                format: double
                example: 9
    ImportSummary:
      type: object
      required: [total, created, errors]
      properties:
        total:
          type: integer
          minimum: 0
          example: 2
        created:
          type: integer
          minimum: 0
          example: 1
        errors:
          type: array
          items:
            type: object
            required: [row, message]
            properties:
              row:
                type: integer
                description: Номер строки CSV с учётом заголовка либо индекс bulk-записи, начиная с 1
                example: 3
              message:
                type: string
                example: budget exceeded
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: amount must be a positive finite number
  responses:
    AuthSuccess:
      description: Пользователь и JWT для заголовка Authorization (Bearer)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    ImportSuccess:
      description: Результат импорта; errors содержит отклонённые записи, успешные уже сохранены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImportSummary'
    BadRequest:
      description: Некорректные поля, JSON, CSV или параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Неверные данные входа, отсутствующий, недействительный или истёкший JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BudgetExceeded:
      description: Сумма расходов категории превышает лимит бюджета; запись не выполнена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: budget exceeded
    InternalError:
      description: Внутренняя ошибка сервиса или хранилища
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Сервис gRPC временно недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Timeout:
      description: Превышено время выполнения запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
